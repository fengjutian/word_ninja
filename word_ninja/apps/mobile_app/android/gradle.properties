org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Use AGP 9 defaults: built-in Kotlin + new DSL. file_picker 11.0.3 (and similar
# Flutter plugins) only skip their own Kotlin plugin under AGP 9 when built-in
# Kotlin is on — otherwise their .kt sources are silently never compiled.
# Keep android.newDsl=false because the Flutter Gradle plugin (3.44.2) isn't
# compatible with AGP 9's new DSL interface yet.
#
# builtInKotlin=false is needed because flutter_plugin_android_lifecycle 2.0.35
# still applies the legacy org.jetbrains.kotlin.android plugin. AGP 9 rejects
# that plugin when builtInKotlin=true. file_picker 11.0.3 is patched in pub
# cache to also apply the legacy Kotlin plugin (it normally skips under AGP 9).
android.newDsl=false
android.builtInKotlin=false
# Disable Kotlin incremental compilation: project lives on D:\ but pub cache is on C:\,
# so kotlin.incremental's relative-path cache files crash with
# "this and base files have different roots".
kotlin.incremental=false
